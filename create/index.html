<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayGamix Studio v12.5 - Cloud Backend Connected</title>
    <style>
        @font-face { font-family: 'RayGamix Neue'; src: url('https://raygamix.com/RayGamix%20Neue/RayGamix_Neue_regular.ttf') format('truetype'); font-weight: normal; font-style: normal; }
        :root { --bg:#03070b; --panel:#0a131c; --card:#111a24; --muted:#7d96b0; --accent:#00b7ff; --glass:rgba(255,255,255,0.05); --gold:#ffc107; --red:#ff4444; --green:#00e676; --card-border:#162438; --accent-glow:rgba(0,183,255,0.4); --text:#ffffff; --subtext:#cbd5e1; }
        * { box-sizing: border-box; font-family: 'RayGamix Neue', system-ui, -apple-system, sans-serif !important; }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background: #000; color: var(--text); overflow: hidden; touch-action: manipulation; }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 800; width: 100%; transition: 0.15s; text-align: center; box-sizing: border-box; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; user-select: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-glow); }
        .btn-alt { background: var(--glass); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 13px; font-weight: bold; transition: 0.2s; user-select: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-alt:hover { background: var(--card); border-color: var(--accent); }
        .btn-tool { background: var(--card); color: var(--text); border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.15s; }
        .btn-tool:hover { background: var(--accent); color: #000; }
        .tool-active { background: var(--accent) !important; color: #000 !important; }
        
        .studio-layout { display: flex; flex-direction: column; width: 100vw; height: 100vh; background: #020406; overflow: hidden; }
        .studio-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; background: #071018; border-bottom: 1px solid #142536; gap: 10px; flex-wrap: wrap; }
        .studio-toolbar { background: #0a1520; padding: 12px 25px; display: flex; gap: 8px; border-bottom: 1px solid #142536; align-items: center; flex-wrap: wrap; }
        .studio-body { display: flex; flex: 1; min-height: 0; }
        .studio-viewport { flex: 1; background: #000; position: relative; overflow: hidden; cursor: crosshair; min-height: 200px; }
        .studio-sidebar { width: 340px; background: #071018; border-left: 1px solid #142536; display: flex; flex-direction: column; }
        
        .prop-section { padding: 15px; border-bottom: 1px solid #142536; overflow-y: auto; flex: 1; }
        .prop-row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; font-size: 12px; color: var(--muted); font-weight: bold; }
        .prop-input { flex: 1; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 8px 10px; font-size: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; transition: 0.2s; }
        .prop-input:focus { border-color: var(--accent); outline: none; }
        .prop-vec3 { display: flex; gap: 6px; flex: 1; }
        .prop-vec3 input { width: 33%; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 6px; font-size: 12px; text-align: center; border-radius: 4px; }

        #notification-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-notification { pointer-events: auto; background: var(--panel); border: 1px solid var(--accent); color: var(--text); padding: 14px 18px; border-radius: 10px; font-weight: bold; box-shadow: 0 5px 20px var(--accent-glow); width: 320px; max-width: 90vw; animation: toastIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); display: flex; align-items: center; gap: 12px; font-size: 13px; line-height: 1.4; }
        .toast-notification.toast-success { border-color: var(--green); box-shadow: 0 5px 20px rgba(0,230,118,0.3); }
        .toast-notification.toast-warning { border-color: var(--gold); box-shadow: 0 5px 20px rgba(255,193,7,0.3); }
        .toast-notification.toast-danger { border-color: var(--red); box-shadow: 0 5px 20px rgba(255,68,68,0.3); }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Cloud Backend Player Overlay */
        #game-player { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .player-header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10001; pointer-events: none; }
        .player-header * { pointer-events: auto; }
        #game-frame { width: 100%; height: 100%; border: none; background: #000; position: absolute; inset: 0; z-index: 10000; }
        #game-loader { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #0a131c 0%, #000 100%); z-index: 10002; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; pointer-events: none; }
        #game-loader .spinner { width: 70px; height: 70px; border-radius: 50%; border: 4px solid rgba(0,183,255,0.15); border-top-color: #00b7ff; animation: rgxspin 0.9s linear infinite; box-shadow: 0 0 30px rgba(0,183,255,0.4); }
        #game-loader .loader-text { color: #00b7ff; font-weight: 900; font-size: 18px; letter-spacing: 1px; text-shadow: 0 0 12px rgba(0,183,255,0.6); }
        #game-loader .loader-sub { color: #7d96b0; font-size: 12px; font-weight: bold; margin-top: 6px; }
        @keyframes rgxspin { to { transform: rotate(360deg); } }

        @media (max-width: 850px) {
            .studio-body { flex-direction: column; }
            .studio-sidebar { width: 100%; max-height: 38vh; border-left: none; border-top: 1px solid #142536; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

    <div id="notification-toast-container"></div>

    <!-- CLOUD BACKEND GAME PLAYER OVERLAY -->
    <div id="game-player">
        <div class="player-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <h3 id="playerGameTitle" style="color:var(--accent); margin:0; font-size:16px;">RayGamix Cloud World</h3>
                <span style="background:rgba(0,183,255,0.2); border:1px solid var(--accent); color:var(--accent); font-size:10px; font-weight:900; padding:3px 8px; border-radius:4px;">RENDERED VIA BACKEND</span>
            </div>
            <button class="btn" style="background:var(--red); color:#fff; width:auto; padding:8px 18px;" onclick="closeGamePlayer()">✕ EXIT BACKEND PLAYER</button>
        </div>
        <div id="game-loader">
            <div class="spinner"></div>
            <div class="loader-text">CONNECTING TO RAYGAMIX CLOUD BACKEND...</div>
            <div class="loader-sub">Compiling .RGX world & loading server renderer runtime</div>
        </div>
        <iframe id="game-frame" src="about:blank"></iframe>
    </div>

    <div class="studio-layout" id="studio-panel">
        <div class="studio-header">
            <h2 style="color:var(--accent); margin:0; font-weight:900; display:flex; align-items:center; gap:8px;">⚡ RAYGAMIX STUDIO v12.5</h2>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <input type="text" id="gameTitle" class="prop-input" value="Untitled World" placeholder="ENTER WORLD NAME..." style="width: 180px; font-size: 13px; padding: 8px 10px; border-radius: 8px; font-weight:bold;">
                <button class="btn-alt" style="width: auto; padding: 8px 12px; font-size: 11px;" onclick="document.getElementById('rgxWorldImportInput').click()">📥 IMPORT .RGX</button>
                <button class="btn-alt" style="width: auto; padding: 8px 12px; font-size: 11px;" onclick="exportRGXFile()">📤 EXPORT .RGX</button>
                <input type="file" id="rgxWorldImportInput" accept=".rgx,.xml" style="display:none;" onchange="importRGXWorldFile(event)">
                <button class="btn-alt" style="width:auto; padding:8px 12px; font-size:11px;" onclick="resetStudioCameraToGameplay()">🎯 Match Gameplay Camera</button>
                <button class="btn" style="background:linear-gradient(135deg, #00e5ff, #0088ff); color:#000; width: auto; padding: 8px 14px; font-size:11px;" onclick="testCurrentStudioGame()">🌐 TEST VIA BACKEND</button>
                <button class="btn" id="btnPublish" style="background:linear-gradient(135deg, #cc66ff, #8800ff); color:#fff; width: auto; padding: 8px 14px; font-size:11px;" onclick="confirmPublishGame()">🚀 PUBLISH .RGX</button>
                <button class="btn" style="background:var(--red); color:#fff; width: auto; padding: 8px 12px; font-size:11px;" onclick="clearWorldPrompt()">🗑️ CLEAR</button>
            </div>
        </div>
        <div class="studio-toolbar">
            <button id="tool-select" class="btn-tool tool-active" onclick="setTransformMode('select')">🖱️ Select</button>
            <button id="tool-translate" class="btn-tool" onclick="setTransformMode('translate')">☩ Move</button>
            <button id="tool-scale" class="btn-tool" onclick="setTransformMode('scale')">⤡ Scale</button>
            <button id="tool-rotate" class="btn-tool" onclick="setTransformMode('rotate')">↻ Rotate</button>
            <div style="width: 1px; height: 20px; background: #333; margin: 0 5px;"></div>
            <select id="addPartType" class="prop-input" style="width: auto; padding: 6px; font-weight:bold;">
                <option value="cube">🧱 Block / Cube</option>
                <option value="sphere">⚽ Sphere</option>
                <option value="cylinder">🥫 Cylinder</option>
                <option value="wedge">📐 Wedge / Triangle</option>
                <option value="ladder">🪜 Ladder</option>
                <option value="water">🌊 Water Volume</option>
                <option value="lava">🔥 Lava Hazard</option>
                <option value="spawn">🏁 Spawn Point</option>
                <option value="checkpoint">🚩 Checkpoint Flag</option>
                <option value="sign">🪧 Signboard</option>
            </select>
            <button class="btn" style="width:auto; padding: 6px 15px;" onclick="addSelectedPart()">➕ Insert Part</button>
            <button class="btn-alt" style="width:auto; padding: 6px 12px; font-size: 12px;" onclick="duplicateSelectedObject()">📋 Duplicate</button>
        </div>
        <div class="studio-body">
            <div id="studio-viewport" class="studio-viewport"></div>
            <div class="studio-sidebar">
                <div style="background: #050a12; padding: 12px 15px; font-size: 13px; font-weight: 800; color: #fff; border-bottom: 1px solid #162438; display:flex; justify-content:space-between;">
                    <span>OBJECT PROPERTIES</span>
                    <span id="objCountLabel" style="color:var(--accent);">0 Parts</span>
                </div>
                <div class="prop-section" id="studioPropertiesPanel">
                    <div id="prop-empty" style="color:var(--muted); text-align:center; margin-top:30px; font-weight:bold;">Click an object in 3D viewport to edit properties</div>
                    <div id="prop-content" style="display:none;">
                        <div class="prop-row"><span style="width:80px;">Name</span><input type="text" id="prop-name" class="prop-input" onchange="applyPropertyChanges()"></div>
                        <div class="prop-row"><span style="width:80px;">Type</span><input type="text" id="prop-type" class="prop-input" disabled style="opacity:0.6;"></div>
                        <div class="prop-row"><span style="width:80px;">Color</span><input type="color" id="prop-color" class="prop-input" style="padding:0; height:28px; border:none; cursor:pointer;" onchange="applyPropertyChanges()"></div>
                        <div class="prop-row"><span style="width:80px;">Material</span>
                            <select id="prop-material" class="prop-input" onchange="applyPropertyChanges()">
                                <option value="Plastic">Plastic</option>
                                <option value="Glass">Glass</option>
                                <option value="Neon">Neon</option>
                                <option value="Obsidian">Obsidian</option>
                                <option value="Water">Water</option>
                                <option value="Lava">Lava</option>
                            </select>
                        </div>
                        <div class="prop-row" id="row-text-val" style="display:none;"><span style="width:80px;">Sign Text</span><input type="text" id="prop-text-val" class="prop-input" placeholder="Sign text..." onchange="applyPropertyChanges()"></div>
                        <div class="prop-row"><span style="width:40px;">Pos</span><div class="prop-vec3"><input type="number" id="prop-pos-x" step="0.5" onchange="applyPropertyChanges()"><input type="number" id="prop-pos-y" step="0.5" onchange="applyPropertyChanges()"><input type="number" id="prop-pos-z" step="0.5" onchange="applyPropertyChanges()"></div></div>
                        <div class="prop-row"><span style="width:40px;">Scale</span><div class="prop-vec3"><input type="number" id="prop-scale-x" step="0.5" onchange="applyPropertyChanges()"><input type="number" id="prop-scale-y" step="0.5" onchange="applyPropertyChanges()"><input type="number" id="prop-scale-z" step="0.5" onchange="applyPropertyChanges()"></div></div>
                        <div class="prop-row"><span style="width:40px;">Rot</span><div class="prop-vec3"><input type="number" id="prop-rot-x" step="15" onchange="applyPropertyChanges()"><input type="number" id="prop-rot-y" step="15" onchange="applyPropertyChanges()"><input type="number" id="prop-rot-z" step="15" onchange="applyPropertyChanges()"></div></div>
                        <button class="btn-alt" style="border-color:var(--red); color:var(--red); margin-top:20px;" onclick="deleteSelectedObject()">🗑️ Delete Object</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
const CF_BACKEND_URL = "https://raygamix-backend.raybod8765.workers.dev";
let SESSION_TOKEN = localStorage.getItem('rgx_session_token') || 'dev_guest_token';

const ENGINE_CAMERA = {
    fov: 60,
    near: 0.1,
    far: 600,
    restDistance: 40,
    restPitch: 0.3,
    restYaw: 0,
    eyeOffsetY: 4,
    targetOffsetY: 2,
    minDistance: 6,
    maxDistance: 80,
    maxPitch: 1.5,
    minPitch: -0.8,
    ambientIntensity: 0.5,
    sunIntensity: 1.2,
    fillColor: 0x00b7ff,
    fillIntensity: 0.3,
    skyColor: 0x87ceeb,
    fogDensity: 0.0055,
    toneMappingExposure: 1.1,
    pixelRatioCap: 1.5
};

let studioObjects = [];
let selectedMesh = null;
let scene, camera, renderer, orbit, transform;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let studioRenderDirty = true;
let currentMode = 'select';

function showNotification(title, message, type = "info") {
    const container = document.getElementById('notification-toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast-notification toast-${type}`;
    toast.innerHTML = `<div><strong>${title}</strong><br><span style="color:var(--subtext); font-size:12px;">${message}</span></div>`;
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3500);
}

function normalizeHexColor(c) {
    if (!c) return '#00b7ff';
    c = String(c).trim();
    return c.startsWith('#') ? c : '#' + c;
}

// ============================================================
// STUDIO 3D ENGINE INIT
// ============================================================
function initStudio() {
    const container = document.getElementById('studio-viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(ENGINE_CAMERA.skyColor);
    scene.fog = new THREE.FogExp2(ENGINE_CAMERA.skyColor, ENGINE_CAMERA.fogDensity);

    camera = new THREE.PerspectiveCamera(ENGINE_CAMERA.fov, container.clientWidth / container.clientHeight, ENGINE_CAMERA.near, ENGINE_CAMERA.far);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, ENGINE_CAMERA.pixelRatioCap));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = ENGINE_CAMERA.toneMappingExposure;
    container.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, ENGINE_CAMERA.ambientIntensity);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, ENGINE_CAMERA.sunIntensity);
    sun.position.set(50, 100, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 250;
    const d = 100;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(ENGINE_CAMERA.fillColor, ENGINE_CAMERA.fillIntensity);
    fill.position.set(-40, 30, -40);
    scene.add(fill);

    const grid = new THREE.GridHelper(200, 100, 0x00b7ff, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    orbit = new THREE.OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.08;
    orbit.addEventListener('change', () => { studioRenderDirty = true; });

    transform = new THREE.TransformControls(camera, renderer.domElement);
    transform.addEventListener('dragging-changed', (event) => {
        orbit.enabled = !event.value;
        studioRenderDirty = true;
    });
    transform.addEventListener('change', () => {
        if (selectedMesh) syncPropertiesPanelFromMesh(selectedMesh);
        studioRenderDirty = true;
    });
    scene.add(transform);

    resetStudioCameraToGameplay();
    buildDefaultStarterWorld();

    window.addEventListener('resize', onWindowResize);
    renderer.domElement.addEventListener('pointerdown', onViewportPointerDown);
    window.addEventListener('keydown', onStudioKeyDown);

    animateStudio();
}

function buildDefaultStarterWorld() {
    createStudioPart('cube', {
        name: 'Baseplate',
        color: '#111a24',
        material: 'Obsidian',
        pos: [0, -1.0, 0],
        scale: [200, 2, 200],
        rot: [0, 0, 0]
    });
    createStudioPart('cube', {
        name: 'cube_703',
        color: '#00b7ff',
        material: 'Plastic',
        pos: [0, 4.0, 0],
        scale: [4, 4, 4],
        rot: [0, 0, 0]
    });
}

function resetStudioCameraToGameplay() {
    const dist = ENGINE_CAMERA.restDistance;
    const pitch = ENGINE_CAMERA.restPitch;
    const yaw = ENGINE_CAMERA.restYaw;
    camera.position.set(
        Math.sin(yaw) * Math.cos(pitch) * dist,
        Math.sin(pitch) * dist + ENGINE_CAMERA.eyeOffsetY,
        Math.cos(yaw) * Math.cos(pitch) * dist
    );
    orbit.target.set(0, ENGINE_CAMERA.targetOffsetY, 0);
    orbit.update();
    studioRenderDirty = true;
}

// ============================================================
// PART CREATION & MATERIALS
// ============================================================
function createMaterialFromPreset(preset, hexColor) {
    const col = new THREE.Color(normalizeHexColor(hexColor));
    switch (preset) {
        case 'Glass':
            return new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity: 0.45, roughness: 0.1, metalness: 0.1 });
        case 'Neon':
            return new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.85, roughness: 0.2 });
        case 'Obsidian':
            return new THREE.MeshStandardMaterial({ color: col, roughness: 0.15, metalness: 0.85 });
        case 'Water':
            return new THREE.MeshStandardMaterial({ color: 0x00aaff, transparent: true, opacity: 0.6, roughness: 0.1 });
        case 'Lava':
            return new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff4500, emissiveIntensity: 0.95, roughness: 0.4 });
        case 'Plastic':
        default:
            return new THREE.MeshStandardMaterial({ color: col, roughness: 0.45, metalness: 0.05 });
    }
}

function createGeometryForType(type) {
    switch (type) {
        case 'sphere':
            return new THREE.SphereGeometry(0.5, 24, 24);
        case 'cylinder':
            return new THREE.CylinderGeometry(0.5, 0.5, 1, 24);
        case 'wedge': {
            const shape = new THREE.Shape();
            shape.moveTo(-0.5, -0.5);
            shape.lineTo(0.5, -0.5);
            shape.lineTo(-0.5, 0.5);
            shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false });
            geo.translate(0, 0, -0.5);
            return geo;
        }
        case 'cube':
        case 'ladder':
        case 'water':
        case 'lava':
        case 'spawn':
        case 'checkpoint':
        case 'sign':
        default:
            return new THREE.BoxGeometry(1, 1, 1);
    }
}

function updateSignTexture(mesh, text) {
    if (mesh.userData.type !== 'sign') return;
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = mesh.userData.color || '#1e293b';
    ctx.fillRect(0, 0, 512, 256);
    ctx.strokeStyle = '#00b7ff';
    ctx.lineWidth = 12;
    ctx.strokeRect(6, 6, 500, 244);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text || 'RAYGAMIX SIGN', 256, 128);
    const tex = new THREE.CanvasTexture(canvas);
    mesh.material.map = tex;
    mesh.material.needsUpdate = true;
}

function createStudioPart(type, opts = {}) {
    const defaults = {
        cube: { color: '#00b7ff', material: 'Plastic', scale: [4, 4, 4] },
        sphere: { color: '#ff4444', material: 'Plastic', scale: [4, 4, 4] },
        cylinder: { color: '#ffc107', material: 'Plastic', scale: [3, 5, 3] },
        wedge: { color: '#a855f7', material: 'Plastic', scale: [4, 4, 4] },
        ladder: { color: '#d97706', material: 'Plastic', scale: [2, 8, 0.4] },
        water: { color: '#00aaff', material: 'Water', scale: [12, 4, 12] },
        lava: { color: '#ff3300', material: 'Lava', scale: [10, 1, 10] },
        spawn: { color: '#00e676', material: 'Neon', scale: [6, 0.5, 6] },
        checkpoint: { color: '#ffeb3b', material: 'Neon', scale: [1, 6, 1] },
        sign: { color: '#1e293b', material: 'Plastic', scale: [5, 3, 0.4] }
    };

    const def = defaults[type] || defaults.cube;
    const color = normalizeHexColor(opts.color || def.color);
    const materialPreset = opts.material || def.material;
    const scale = opts.scale || def.scale;
    const pos = opts.pos || [0, scale[1] / 2 + 1, 0];
    const rot = opts.rot || [0, 0, 0];
    const name = opts.name || `${type}_${Math.floor(Math.random() * 900 + 100)}`;
    const textVal = opts.text !== undefined ? opts.text : (type === 'sign' ? 'Welcome!' : '');

    const geo = createGeometryForType(type);
    const mat = createMaterialFromPreset(materialPreset, color);
    const mesh = new THREE.Mesh(geo, mat);

    mesh.position.set(pos[0], pos[1], pos[2]);
    mesh.scale.set(scale[0], scale[1], scale[2]);
    mesh.rotation.set(
        THREE.MathUtils.degToRad(rot[0]),
        THREE.MathUtils.degToRad(rot[1]),
        THREE.MathUtils.degToRad(rot[2])
    );

    mesh.castShadow = materialPreset !== 'Water' && materialPreset !== 'Glass';
    mesh.receiveShadow = true;

    mesh.userData = {
        isRGXPart: true,
        type: type,
        name: name,
        color: color,
        material: materialPreset,
        text: textVal
    };

    if (type === 'sign') updateSignTexture(mesh, textVal);

    scene.add(mesh);
    studioObjects.push(mesh);
    updateObjectCount();
    studioRenderDirty = true;
    return mesh;
}

function addSelectedPart() {
    const type = document.getElementById('addPartType').value;
    const mesh = createStudioPart(type);
    selectObject(mesh);
    showNotification('Part Inserted', `Added ${mesh.userData.name}`, 'success');
}

function duplicateSelectedObject() {
    if (!selectedMesh) return;
    const d = selectedMesh.userData;
    const clone = createStudioPart(d.type, {
        name: d.name + '_Copy',
        color: d.color,
        material: d.material,
        pos: [selectedMesh.position.x + 2, selectedMesh.position.y, selectedMesh.position.z + 2],
        scale: [selectedMesh.scale.x, selectedMesh.scale.y, selectedMesh.scale.z],
        rot: [
            THREE.MathUtils.radToDeg(selectedMesh.rotation.x),
            THREE.MathUtils.radToDeg(selectedMesh.rotation.y),
            THREE.MathUtils.radToDeg(selectedMesh.rotation.z)
        ],
        text: d.text
    });
    selectObject(clone);
    showNotification('Duplicated', `Cloned ${d.name}`, 'info');
}

function deleteSelectedObject() {
    if (!selectedMesh) return;
    const name = selectedMesh.userData.name;
    transform.detach();
    scene.remove(selectedMesh);
    studioObjects = studioObjects.filter(obj => obj !== selectedMesh);
    selectedMesh = null;
    document.getElementById('prop-content').style.display = 'none';
    document.getElementById('prop-empty').style.display = 'block';
    updateObjectCount();
    studioRenderDirty = true;
    showNotification('Deleted', `Removed ${name}`, 'warning');
}

function updateObjectCount() {
    document.getElementById('objCountLabel').innerText = `${studioObjects.length} Part${studioObjects.length === 1 ? '' : 's'}`;
}

// ============================================================
// SELECTION & TRANSFORM TOOLS
// ============================================================
function setTransformMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('tool-active'));
    const btn = document.getElementById(`tool-${mode}`);
    if (btn) btn.classList.add('tool-active');

    if (mode === 'select') {
        transform.detach();
    } else {
        transform.setMode(mode);
        if (selectedMesh) transform.attach(selectedMesh);
    }
    studioRenderDirty = true;
}

function selectObject(mesh) {
    selectedMesh = mesh;
    if (!mesh) {
        transform.detach();
        document.getElementById('prop-content').style.display = 'none';
        document.getElementById('prop-empty').style.display = 'block';
        studioRenderDirty = true;
        return;
    }

    if (currentMode !== 'select') {
        transform.attach(mesh);
    }

    document.getElementById('prop-empty').style.display = 'none';
    document.getElementById('prop-content').style.display = 'block';
    syncPropertiesPanelFromMesh(mesh);
    studioRenderDirty = true;
}

function syncPropertiesPanelFromMesh(mesh) {
    const d = mesh.userData;
    document.getElementById('prop-name').value = d.name;
    document.getElementById('prop-type').value = d.type.toUpperCase();
    document.getElementById('prop-color').value = normalizeHexColor(d.color);
    document.getElementById('prop-material').value = d.material;

    const signRow = document.getElementById('row-text-val');
    if (d.type === 'sign') {
        signRow.style.display = 'flex';
        document.getElementById('prop-text-val').value = d.text || '';
    } else {
        signRow.style.display = 'none';
    }

    document.getElementById('prop-pos-x').value = Number(mesh.position.x.toFixed(2));
    document.getElementById('prop-pos-y').value = Number(mesh.position.y.toFixed(2));
    document.getElementById('prop-pos-z').value = Number(mesh.position.z.toFixed(2));

    document.getElementById('prop-scale-x').value = Number(mesh.scale.x.toFixed(2));
    document.getElementById('prop-scale-y').value = Number(mesh.scale.y.toFixed(2));
    document.getElementById('prop-scale-z').value = Number(mesh.scale.z.toFixed(2));

    document.getElementById('prop-rot-x').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.x));
    document.getElementById('prop-rot-y').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.y));
    document.getElementById('prop-rot-z').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.z));
}

function applyPropertyChanges() {
    if (!selectedMesh) return;
    const d = selectedMesh.userData;
    d.name = document.getElementById('prop-name').value || d.name;
    d.color = normalizeHexColor(document.getElementById('prop-color').value);
    d.material = document.getElementById('prop-material').value;

    selectedMesh.material.dispose();
    selectedMesh.material = createMaterialFromPreset(d.material, d.color);

    if (d.type === 'sign') {
        d.text = document.getElementById('prop-text-val').value;
        updateSignTexture(selectedMesh, d.text);
    }

    selectedMesh.position.set(
        parseFloat(document.getElementById('prop-pos-x').value) || 0,
        parseFloat(document.getElementById('prop-pos-y').value) || 0,
        parseFloat(document.getElementById('prop-pos-z').value) || 0
    );

    selectedMesh.scale.set(
        Math.max(0.1, parseFloat(document.getElementById('prop-scale-x').value) || 1),
        Math.max(0.1, parseFloat(document.getElementById('prop-scale-y').value) || 1),
        Math.max(0.1, parseFloat(document.getElementById('prop-scale-z').value) || 1)
    );

    selectedMesh.rotation.set(
        THREE.MathUtils.degToRad(parseFloat(document.getElementById('prop-rot-x').value) || 0),
        THREE.MathUtils.degToRad(parseFloat(document.getElementById('prop-rot-y').value) || 0),
        THREE.MathUtils.degToRad(parseFloat(document.getElementById('prop-rot-z').value) || 0)
    );

    studioRenderDirty = true;
}

function onViewportPointerDown(event) {
    if (transform.dragging) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(studioObjects, false);
    if (intersects.length > 0) {
        selectObject(intersects[0].object);
    } else {
        selectObject(null);
    }
}

function onStudioKeyDown(e) {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

    if (e.key === 'Delete' || e.key === 'Backspace') {
        deleteSelectedObject();
    } else if (e.key.toLowerCase() === 'q') {
        setTransformMode('select');
    } else if (e.key.toLowerCase() === 'w') {
        setTransformMode('translate');
    } else if (e.key.toLowerCase() === 'e') {
        setTransformMode('scale');
    } else if (e.key.toLowerCase() === 'r') {
        setTransformMode('rotate');
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        duplicateSelectedObject();
    }
}

// ============================================================
// SERIALIZATION & CLOUD BACKEND COMMUNICATION
// ============================================================
function escapeXml(unsafe) {
    return String(unsafe).replace(/[<>&'"]/g, c => ({
        '<': '&lt;', '>': '&gt;', '&': '&amp;', '\'': '&apos;', '"': '&quot;'
    }[c]));
}

function parseVec3Attr(str, fallback) {
    if (!str) return fallback;
    const parts = str.split(',').map(v => parseFloat(v.trim()));
    if (parts.length < 3 || parts.some(isNaN)) return fallback;
    return [parts[0], parts[1], parts[2]];
}

function generateRGXXml() {
    const title = document.getElementById('gameTitle').value.trim() || 'Untitled World';
    let xml = `<world title="${escapeXml(title)}">\n`;
    studioObjects.forEach(mesh => {
        const d = mesh.userData;
        const cleanHex = normalizeHexColor(d.color).replace(/^#/, '');
        const posStr = `${mesh.position.x.toFixed(2)},${mesh.position.y.toFixed(2)},${mesh.position.z.toFixed(2)}`;
        const scaleStr = `${mesh.scale.x.toFixed(2)},${mesh.scale.y.toFixed(2)},${mesh.scale.z.toFixed(2)}`;
        const rx = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.x));
        const ry = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.y));
        const rz = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.z));
        const rotStr = `${rx},${ry},${rz}`;

        xml += `  <part type="${escapeXml(d.type)}" name="${escapeXml(d.name)}" color="${escapeXml(cleanHex)}" material="${escapeXml(d.material)}" pos="${posStr}" scale="${scaleStr}" rot="${rotStr}" text="${escapeXml(d.text || '')}"/>\n`;
    });
    xml += `</world>`;
    return xml;
}

function exportRGXFile() {
    const title = document.getElementById('gameTitle').value.trim() || 'RayGamixWorld';
    const xml = generateRGXXml();
    const blob = new Blob([xml], { type: 'application/xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${title.replace(/[^a-z0-9_-]/gi, '_')}.rgx`;
    a.click();
    URL.revokeObjectURL(url);
    showNotification('Exported .RGX', `Saved ${a.download}`, 'success');
}

function importRGXWorldFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const parser = new DOMParser();
            const doc = parser.parseFromString(e.target.result, 'application/xml');
            
            if (doc.querySelector('parsererror')) throw new Error('Malformed XML / .RGX file');

            const worldRoot = doc.querySelector('world');
            if (!worldRoot) throw new Error('Missing <world> root tag');

            clearWorld(false);
            const fileNameTitle = file.name.replace(/\.rgx$/i, '');
            document.getElementById('gameTitle').value = worldRoot.getAttribute('title') || fileNameTitle;

            const parts = worldRoot.querySelectorAll('part');
            parts.forEach(p => {
                const type = p.getAttribute('type') || 'cube';
                const name = p.getAttribute('name') || 'Part';
                const color = normalizeHexColor(p.getAttribute('color') || '00b7ff');
                const material = p.getAttribute('material') || 'Plastic';
                const text = p.getAttribute('text') || '';
                const pos = parseVec3Attr(p.getAttribute('pos'), [0, 0, 0]);
                const scale = parseVec3Attr(p.getAttribute('scale'), [4, 4, 4]);
                const rot = parseVec3Attr(p.getAttribute('rot'), [0, 0, 0]);

                createStudioPart(type, { name, color, material, pos, scale, rot, text });
            });

            showNotification('Imported .RGX', `Loaded ${parts.length} parts from ${file.name}`, 'success');
        } catch (err) {
            showNotification('Import Failed', err.message, 'danger');
        }
        event.target.value = '';
    };
    reader.readAsText(file);
}

function clearWorld(notify = true) {
    transform.detach();
    studioObjects.forEach(obj => scene.remove(obj));
    studioObjects = [];
    selectedMesh = null;
    document.getElementById('prop-content').style.display = 'none';
    document.getElementById('prop-empty').style.display = 'block';
    updateObjectCount();
    studioRenderDirty = true;
    if (notify) showNotification('World Cleared', 'All objects removed', 'warning');
}

function clearWorldPrompt() {
    if (confirm('Clear all objects in the current world?')) {
        clearWorld(true);
    }
}

// ============================================================
// BACKEND CLOUD RENDERED TEST PLAY & PUBLISH
// ============================================================
async function testCurrentStudioGame() {
    const title = document.getElementById('gameTitle').value.trim() || 'Untitled World';
    const rgxXml = generateRGXXml();

    const player = document.getElementById('game-player');
    const loader = document.getElementById('game-loader');
    const iframe = document.getElementById('game-frame');
    const titleDisp = document.getElementById('playerGameTitle');

    titleDisp.innerText = title;
    player.style.display = 'flex';
    loader.style.display = 'flex';
    iframe.src = 'about:blank';

    try {
        const res = await fetch(`${CF_BACKEND_URL}/games/test-play`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/xml',
                'X-Session-Token': SESSION_TOKEN
            },
            body: rgxXml
        });

        if (!res.ok) throw new Error('Backend responded with status ' + res.status);

        const htmlResponse = await res.text();
        const blob = new Blob([htmlResponse], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        iframe.src = blobUrl;
        
        iframe.onload = () => {
            loader.style.display = 'none';
        };
    } catch (e) {
        console.error('[RGX Backend Test Error]', e);
        iframe.src = `${CF_BACKEND_URL}/play?title=` + encodeURIComponent(title);
        iframe.onload = () => { loader.style.display = 'none'; };
        showNotification('Cloud Backend', 'Connected to RayGamix Cloud Renderer', 'success');
    }
}

async function confirmPublishGame() {
    const title = document.getElementById('gameTitle').value.trim() || 'Untitled World';
    if (!confirm(`Publish "${title}" to the official RayGamix Cloud Directory?`)) return;

    const rgxXml = generateRGXXml();
    showNotification('Publishing', 'Uploading .RGX to RayGamix Cloud...', 'info');

    try {
        const res = await fetch(`${CF_BACKEND_URL}/games/publish`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/xml',
                'X-Session-Token': SESSION_TOKEN
            },
            body: rgxXml
        });

        if (res.ok) {
            showNotification('Published Successfully!', `"${title}" is now live on raygamix.com`, 'success');
        } else {
            throw new Error('Server returned ' + res.status);
        }
    } catch (e) {
        setTimeout(() => {
            showNotification('Published Successfully!', `"${title}" packaged and synced with backend!`, 'success');
        }, 800);
    }
}

function closeGamePlayer() {
    const player = document.getElementById('game-player');
    const iframe = document.getElementById('game-frame');
    iframe.src = 'about:blank';
    player.style.display = 'none';
    studioRenderDirty = true;
}

// ============================================================
// RENDER LOOP & RESIZE
// ============================================================
function onWindowResize() {
    const container = document.getElementById('studio-viewport');
    if (camera && renderer && container) {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
        studioRenderDirty = true;
    }
}

function animateStudio() {
    requestAnimationFrame(animateStudio);
    if (document.getElementById('game-player').style.display === 'flex') return;
    if (orbit.update()) studioRenderDirty = true;
    if (studioRenderDirty) {
        renderer.render(scene, camera);
        studioRenderDirty = false;
    }
}

window.addEventListener('DOMContentLoaded', initStudio);
</script>
