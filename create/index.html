<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayGamix Studio v12.5</title>
    <style>
        @font-face { font-family: 'RayGamix Neue'; src: url('https://raygamix.com/RayGamix%20Neue/RayGamix_Neue_regular.ttf') format('truetype'); }
        :root { --bg:#03070b; --panel:#0a131c; --card:#111a24; --muted:#7d96b0; --accent:#00b7ff; --glass:rgba(255,255,255,0.05); --gold:#ffc107; --red:#ff4444; --green:#00e676; --card-border:#162438; --accent-glow:rgba(0,183,255,0.4); --text:#ffffff; --subtext:#cbd5e1; }
        * { box-sizing: border-box; font-family: 'RayGamix Neue', system-ui, -apple-system, sans-serif !important; }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background: #000; color: var(--text); overflow: hidden; }

        .btn { background: var(--accent); color: #000; border: none; padding: 8px 13px; border-radius: 8px; cursor: pointer; font-weight: 800; transition: 0.15s; text-transform: uppercase; font-size: 11.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
        .btn:hover { filter: brightness(1.18); }
        .btn-alt { background: var(--glass); border: 1px solid var(--card-border); color: var(--text); padding: 7px 11px; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
        .btn-alt:hover { background: var(--card); border-color: var(--accent); }
        .btn-tool { background: var(--card); color: var(--text); border: 1px solid var(--card-border); padding: 7px 11px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .tool-active { background: var(--accent) !important; color: #000 !important; border-color: var(--accent) !important; }

        .studio-layout { display: flex; flex-direction: column; width: 100vw; height: 100vh; background: #020406; }
        .studio-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #071018; border-bottom: 1px solid #142536; gap: 8px; flex-wrap: wrap; }
        .studio-toolbar { background: #0a1520; padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid #142536; align-items: center; flex-wrap: wrap; }
        .studio-body { display: flex; flex: 1; min-height: 0; width: 100%; overflow: hidden; }
        .studio-viewport { flex: 1; min-width: 0; background: #071018; position: relative; overflow: hidden; cursor: crosshair; }
        .studio-viewport canvas { display: block; width: 100% !important; height: 100% !important; }
        .studio-sidebar { width: 370px; flex-shrink: 0; background: #071018; border-left: 1px solid #142536; display: flex; flex-direction: column; overflow: hidden; }

        .prop-section { padding: 14px; overflow-y: auto; flex: 1; }
        .prop-row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; font-size: 12px; color: var(--muted); font-weight: bold; gap: 8px; }
        .prop-input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 7px 9px; font-size: 12px; border-radius: 6px; }
        .prop-vec3 { display: flex; gap: 5px; flex: 1; }
        .prop-vec3 input { width: 33.3%; min-width: 0; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 6px 4px; font-size: 12px; text-align: center; border-radius: 4px; }
        .script-textarea { width: 100%; min-height: 140px; resize: vertical; background: #020509; border: 1px solid #1c3147; color: #7dd3fc; border-radius: 6px; padding: 8px; font-size: 11.5px; font-family: monospace !important; }

        #viewport-status { position: absolute; top: 12px; left: 12px; background: rgba(7,16,24,0.88); border: 1px solid #1c3147; color: #7dd3fc; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; pointer-events: none; z-index: 20; }
        #notification-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-notification { pointer-events: auto; background: var(--panel); border: 1px solid var(--accent); color: var(--text); padding: 12px 16px; border-radius: 10px; font-weight: bold; width: 340px; font-size: 12.5px; }
        .toast-success { border-color: var(--green); }
        .toast-warning { border-color: var(--gold); }
        .toast-danger { border-color: var(--red); }

        #game-player { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .player-header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10001; }
        #game-frame { width: 100%; height: 100%; border: none; position: absolute; inset: 0; z-index: 10000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>
    <div id="notification-toast-container"></div>

    <div id="game-player">
        <div class="player-header">
            <h3 id="playerGameTitle" style="color:var(--accent); margin:0; font-size:16px;">RayGamix Cloud World</h3>
            <button class="btn" style="background:var(--red); color:#fff;" onclick="closeGamePlayer()">✕ EXIT PLAYER</button>
        </div>
        <iframe id="game-frame" src="about:blank"></iframe>
    </div>

    <div class="studio-layout" id="studio-panel">
        <div class="studio-header">
            <h2 style="color:var(--accent); margin:0; font-weight:900; font-size:17px;">⚡ RAYGAMIX STUDIO v12.5</h2>
            <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                <input type="text" id="gameTitle" class="prop-input" value="Untitled World" style="width:150px; font-weight:bold;">
                <button class="btn-alt" onclick="document.getElementById('rgxWorldImportInput').click()">📥 IMPORT .RGX</button>
                <button class="btn-alt" onclick="exportRGXFile()">📤 EXPORT .RGX</button>
                <input type="file" id="rgxWorldImportInput" accept=".rgx,.xml" style="display:none;" onchange="importRGXWorldFile(event)">
                <button class="btn-alt" onclick="resetStudioCameraToGameplay()">🎯 Match Gameplay Camera</button>
                <button class="btn" style="background:linear-gradient(135deg,#00e5ff,#0088ff);" onclick="testCurrentStudioGame()">🌐 TEST VIA BACKEND</button>
                <button class="btn" id="btnPublish" style="background:linear-gradient(135deg,#cc66ff,#8800ff); color:#fff;" onclick="confirmPublishGame()">🚀 PUBLISH .RGX</button>
                <button class="btn" style="background:var(--red); color:#fff;" onclick="clearWorldPrompt()">🗑️ CLEAR</button>
            </div>
        </div>
        <div class="studio-toolbar">
            <button id="tool-select" class="btn-tool tool-active" onclick="setTransformMode('select')">🖱️ Select</button>
            <button id="tool-translate" class="btn-tool" onclick="setTransformMode('translate')">☩ Move</button>
            <button id="tool-scale" class="btn-tool" onclick="setTransformMode('scale')">⤡ Scale</button>
            <button id="tool-rotate" class="btn-tool" onclick="setTransformMode('rotate')">↻ Rotate</button>
            <select id="addPartType" class="prop-input" style="width:auto; min-width:150px; font-weight:bold;">
                <option value="cube">🧱 Block / Cube</option>
                <option value="sphere">⚽ Sphere</option>
                <option value="cylinder">🥫 Cylinder</option>
                <option value="wedge">📐 Wedge / Triangle</option>
                <option value="ladder">🪜 Ladder</option>
                <option value="water">🌊 Water Volume</option>
                <option value="lava">🔥 Lava Hazard</option>
                <option value="spawn">🏁 Spawn Point</option>
                <option value="checkpoint">🚩 Checkpoint Flag</option>
                <option value="sign">🪧 Signboard</option>
                <option value="npc">🧑 NPC</option>
            </select>
            <button class="btn" onclick="addSelectedPart()">➕ INSERT PART</button>
            <button class="btn-alt" onclick="duplicateSelectedObject()">📋 Duplicate</button>
        </div>
        <div class="studio-body">
            <div id="studio-viewport" class="studio-viewport">
                <div id="viewport-status">Booting Studio...</div>
            </div>
            <div class="studio-sidebar">
                <div style="background:#050a12; padding:11px 14px; font-size:12px; font-weight:800; border-bottom:1px solid #162438; display:flex; justify-content:space-between;">
                    <span>OBJECT PROPERTIES</span>
                    <span id="objCountLabel" style="color:var(--accent);">0 / 500 Parts</span>
                </div>
                <div class="prop-section">
                    <div id="prop-empty" style="color:var(--muted); text-align:center; margin-top:30px; font-weight:bold;">Click an object in 3D viewport to edit properties</div>
                    <div id="prop-content" style="display:none;">
                        <div class="prop-row"><span style="width:70px;">Name</span><input type="text" id="prop-name" class="prop-input" onchange="applyPropertyChanges()"></div>
                        <div class="prop-row"><span style="width:70px;">Type</span><input type="text" id="prop-type" class="prop-input" disabled></div>
                        <div class="prop-row"><span style="width:70px;">Color</span><input type="color" id="prop-color" class="prop-input" style="padding:0; height:28px;" onchange="applyPropertyChanges()"></div>
                        <div class="prop-row"><span style="width:70px;">Material</span>
                            <select id="prop-material" class="prop-input" onchange="applyPropertyChanges()">
                                <option value="Plastic">Plastic</option><option value="Glass">Glass</option><option value="Neon">Neon</option>
                                <option value="Obsidian">Obsidian</option><option value="Water">Water</option><option value="Lava">Lava</option>
                                <option value="Metal">Metal</option><option value="Wood">Wood</option><option value="Concrete">Concrete</option>
                                <option value="Ice">Ice</option><option value="Hologram">Hologram</option><option value="Carpet">Carpet</option><option value="Brick">Brick</option>
                            </select>
                        </div>
                        <div class="prop-row" id="row-text-val" style="display:none;"><span style="width:70px;">Sign Text</span><input type="text" id="prop-text-val" class="prop-input" maxlength="256" onchange="applyPropertyChanges()"></div>
                        <div class="prop-row"><span style="width:42px;">Pos</span><div class="prop-vec3"><input type="number" id="prop-pos-x" step="0.5" onchange="applyPropertyChanges()"><input type="number" id="prop-pos-y" step="0.5" onchange="applyPropertyChanges()"><input type="number" id="prop-pos-z" step="0.5" onchange="applyPropertyChanges()"></div></div>
                        <div class="prop-row"><span style="width:42px;">Scale</span><div class="prop-vec3"><input type="number" id="prop-scale-x" step="0.5" min="0.05" onchange="applyPropertyChanges()"><input type="number" id="prop-scale-y" step="0.5" min="0.05" onchange="applyPropertyChanges()"><input type="number" id="prop-scale-z" step="0.5" min="0.05" onchange="applyPropertyChanges()"></div></div>
                        <div class="prop-row"><span style="width:42px;">Rot</span><div class="prop-vec3"><input type="number" id="prop-rot-x" step="15" onchange="applyPropertyChanges()"><input type="number" id="prop-rot-y" step="15" onchange="applyPropertyChanges()"><input type="number" id="prop-rot-z" step="15" onchange="applyPropertyChanges()"></div></div>
                        <div style="margin-top:10px; border-top:1px solid #142536; padding-top:10px;">
                            <div style="font-size:11px; font-weight:900; color:var(--accent); margin-bottom:6px;">RGXSCRIPT v2 (THIS OBJECT)</div>
                            <textarea id="prop-script" class="script-textarea" onchange="applyPropertyChanges()"></textarea>
                        </div>
                        <button class="btn-alt" style="border-color:var(--red); color:var(--red); margin-top:14px;" onclick="deleteSelectedObject()">🗑️ Delete Object</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
const CF_BACKEND_URL = "https://raygamix-backend.raybod8765.workers.dev";
let SESSION_TOKEN = localStorage.getItem('rgx_session_token') || 'dev_guest_token';
const MAX_OBJECTS_PER_WORLD = 500;
const ALLOWED_TYPES = new Set(['cube','sphere','cylinder','wedge','ladder','water','lava','spawn','checkpoint','sign','npc']);
const ALLOWED_MATERIALS = new Set(['Plastic','Glass','Neon','Obsidian','Water','Lava','Metal','Wood','Concrete','Ice','Hologram','Carpet','Brick']);

let studioObjects = [];
let selectedMesh = null;
let scene, camera, renderer, orbit, transform;
let raycaster = null, mouse = null;
let studioRenderDirty = true;
let currentMode = 'select';
let studioInitialized = false;
let activeTestBlobUrl = null;
let rgxScriptTickCounter = 0;

function setStatus(msg) {
    try {
        const el = document.getElementById('viewport-status');
        if (el) el.textContent = String(msg || '');
    } catch (_) {}
}

window.onerror = function(msg, src, line) {
    setStatus('JS Error (line ' + line + '): ' + msg);
    return true;
};

window.addEventListener('unhandledrejection', function(ev) {
    const reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Promise rejected';
    setStatus('Async Guard: ' + reason);
});

function showNotification(title, message, type = "info") {
    try {
        const c = document.getElementById('notification-toast-container');
        if (!c) return;
        const t = document.createElement('div');
        t.className = 'toast-notification toast-' + type;
        t.textContent = title + ': ' + message;
        c.appendChild(t);
        setTimeout(() => { try { t.remove(); } catch (_) {} }, 4000);
    } catch (_) {}
}

function normalizeHexColor(c) {
    try {
        c = String(c || '').trim();
        if (/^#[0-9a-fA-F]{6}$/.test(c)) return c;
        if (/^[0-9a-fA-F]{6}$/.test(c)) return '#' + c;
    } catch (_) {}
    return '#00b7ff';
}

function escapeHtmlAttr(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function parseVec3Csv(val, fallback) {
    const fb = Array.isArray(fallback) ? fallback : [0, 0, 0];
    if (typeof val !== 'string' || !val.trim()) return fb.slice();
    const parts = val.split(',').map(n => Number(n.trim()));
    return [
        Number.isFinite(parts[0]) ? parts[0] : fb[0],
        Number.isFinite(parts[1]) ? parts[1] : fb[1],
        Number.isFinite(parts[2]) ? parts[2] : fb[2]
    ];
}

function createGeometryForType(type) {
    const safeType = ALLOWED_TYPES.has(type) ? type : 'cube';
    if (safeType === 'sphere') return new THREE.SphereGeometry(0.5, 24, 24);
    if (safeType === 'cylinder') return new THREE.CylinderGeometry(0.5, 0.5, 1, 24);
    if (safeType === 'wedge') {
        const shape = new THREE.Shape();
        shape.moveTo(-0.5, -0.5);
        shape.lineTo(0.5, -0.5);
        shape.lineTo(-0.5, 0.5);
        shape.closePath();
        const geo = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false });
        geo.translate(0, 0, -0.5);
        return geo;
    }
    return new THREE.BoxGeometry(1, 1, 1);
}

function createMaterialFromPreset(preset, hexColor) {
    const safePreset = ALLOWED_MATERIALS.has(preset) ? preset : 'Plastic';
    const col = new THREE.Color(normalizeHexColor(hexColor));
    if (safePreset === 'Neon') return new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.85, roughness: 0.25 });
    if (safePreset === 'Glass' || safePreset === 'Hologram') return new THREE.MeshStandardMaterial({ color: col, transparent: true, opacity: safePreset === 'Hologram' ? 0.55 : 0.45, roughness: 0.15 });
    if (safePreset === 'Water') return new THREE.MeshStandardMaterial({ color: 0x00aaff, transparent: true, opacity: 0.6, roughness: 0.2 });
    if (safePreset === 'Lava') return new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff4500, emissiveIntensity: 0.95, roughness: 0.5 });
    if (safePreset === 'Metal') return new THREE.MeshStandardMaterial({ color: col, metalness: 0.75, roughness: 0.28 });
    if (safePreset === 'Obsidian') return new THREE.MeshStandardMaterial({ color: col, metalness: 0.2, roughness: 0.2 });
    return new THREE.MeshStandardMaterial({ color: col, roughness: 0.45 });
}

function evalRgxExpr(expr, ctx) {
    const raw = String(expr || '').trim();
    if (!raw) return '';
    if (/^["'].*["']$/.test(raw)) return raw.slice(1, -1);
    if (/^(true|false)$/i.test(raw)) return raw.toLowerCase() === 'true';
    if (!Number.isNaN(Number(raw)) && raw !== '') return Number(raw);
    if (raw === 'this.x') return ctx.mesh.position.x;
    if (raw === 'this.y') return ctx.mesh.position.y;
    if (raw === 'this.z') return ctx.mesh.position.z;
    if (raw === 'this.color') return ctx.mesh.userData.color;
    if (raw === 'this.material') return ctx.mesh.userData.material;
    if (raw === 'this.name') return ctx.mesh.userData.name;
    if (Object.prototype.hasOwnProperty.call(ctx.vars, raw)) return ctx.vars[raw];
    const mathMatch = raw.match(/^([a-zA-Z0-9_."']+)\s*([+\-*/])\s*([a-zA-Z0-9_."']+)$/);
    if (mathMatch) {
        const left = Number(evalRgxExpr(mathMatch[1], ctx));
        const op = mathMatch[2];
        const right = Number(evalRgxExpr(mathMatch[3], ctx));
        if (Number.isFinite(left) && Number.isFinite(right)) {
            if (op === '+') return left + right;
            if (op === '-') return left - right;
            if (op === '*') return left * right;
            if (op === '/') return right === 0 ? 0 : left / right;
        }
    }
    return raw;
}

function applyRgxCommandToMesh(mesh, propPath, value) {
    if (!mesh || !mesh.userData) return;
    const key = String(propPath || '').trim().toLowerCase();
    if (key === 'this.color' || key === 'color') {
        const hex = normalizeHexColor(value);
        mesh.userData.color = hex;
        if (mesh.material) {
            mesh.material.dispose();
            mesh.material = createMaterialFromPreset(mesh.userData.material, hex);
        }
        studioRenderDirty = true;
    } else if (key === 'this.material' || key === 'material') {
        if (ALLOWED_MATERIALS.has(String(value))) {
            mesh.userData.material = String(value);
            if (mesh.material) {
                mesh.material.dispose();
                mesh.material = createMaterialFromPreset(mesh.userData.material, mesh.userData.color);
            }
            studioRenderDirty = true;
        }
    } else if (key === 'this.x' || key === 'x') {
        const n = Number(value);
        if (Number.isFinite(n)) { mesh.position.x = n; studioRenderDirty = true; }
    } else if (key === 'this.y' || key === 'y') {
        const n = Number(value);
        if (Number.isFinite(n)) { mesh.position.y = n; studioRenderDirty = true; }
    } else if (key === 'this.z' || key === 'z') {
        const n = Number(value);
        if (Number.isFinite(n)) { mesh.position.z = n; studioRenderDirty = true; }
    } else if (key === 'this.roty' || key === 'roty') {
        const n = Number(value);
        if (Number.isFinite(n)) { mesh.rotation.y = THREE.MathUtils.degToRad(n); studioRenderDirty = true; }
    } else if (key === 'this.text' || key === 'text') {
        mesh.userData.text = String(value == null ? '' : value);
    }
    if (selectedMesh === mesh) {
        try { syncPropertiesPanelFromMesh(mesh); } catch (_) {}
    }
}

function executeRGXScriptForEvent(mesh, eventName) {
    if (!mesh || !mesh.userData || !mesh.userData.script) return;
    const targetEvent = String(eventName || 'start').toLowerCase().replace(/\s+/g, '');
    const lines = String(mesh.userData.script).split(/\r?\n/);
    let activeBlock = 'start';
    const ctx = { mesh, vars: Object.create(null) };

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line.startsWith('//') || line.startsWith('#')) continue;

        const evMatch = line.match(/^on\s+([a-zA-Z0-9_ ]+?)\s*:?$/i);
        if (evMatch) {
            activeBlock = evMatch[1].toLowerCase().replace(/\s+/g, '');
            continue;
        }
        if (activeBlock !== targetEvent) continue;

        const setMatch = line.match(/^set\s+([a-zA-Z0-9_.]+)\s*=\s*(.+)$/i);
        if (setMatch) {
            const target = setMatch[1].trim();
            const val = evalRgxExpr(setMatch[2].trim(), ctx);
            if (target.startsWith('this.')) {
                applyRgxCommandToMesh(mesh, target, val);
            } else {
                ctx.vars[target] = val;
            }
            continue;
        }

        const moveMatch = line.match(/^move\s+(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/i);
        if (moveMatch) {
            mesh.position.x += Number(moveMatch[1]);
            mesh.position.y += Number(moveMatch[2]);
            mesh.position.z += Number(moveMatch[3]);
            studioRenderDirty = true;
            if (selectedMesh === mesh) {
                try { syncPropertiesPanelFromMesh(mesh); } catch (_) {}
            }
            continue;
        }

        const logMatch = line.match(/^log\s+(.+)$/i);
        if (logMatch) {
            const msg = String(evalRgxExpr(logMatch[1].trim(), ctx));
            showNotification(mesh.userData.name || 'RGXScript', msg, 'info');
        }
    }
}

function runAllRGXScripts(eventName) {
    for (let i = 0; i < studioObjects.length; i++) {
        try {
            executeRGXScriptForEvent(studioObjects[i], eventName);
        } catch (err) {
            setStatus('RGXScript Guard: ' + (err && err.message ? err.message : err));
        }
    }
}

function initStudioWhenReady() {
    const container = document.getElementById('studio-viewport');
    if (!container) return;

    if (typeof THREE === 'undefined') {
        setStatus('ERROR: THREE.js did not load (check internet / CSP / js tags).');
        return;
    }

    const w = container.clientWidth;
    const h = container.clientHeight;
    if (w < 10 || h < 10) {
        setStatus('Waiting for visible viewport size (' + w + 'x' + h + ')...');
        setTimeout(initStudioWhenReady, 150);
        return;
    }

    if (studioInitialized) return;
    studioInitialized = true;

    try {
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0045);

        camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 600);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.1);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        const grid = new THREE.GridHelper(200, 100, 0x00b7ff, 0x1e293b);
        grid.position.y = 0.01;
        scene.add(grid);

        if (typeof THREE.OrbitControls === 'function') {
            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            orbit.enableDamping = true;
            orbit.addEventListener('change', () => { studioRenderDirty = true; });
        }

        if (typeof THREE.TransformControls === 'function') {
            transform = new THREE.TransformControls(camera, renderer.domElement);
            transform.addEventListener('dragging-changed', e => { if (orbit) orbit.enabled = !e.value; });
            transform.addEventListener('change', () => { if (selectedMesh) syncPropertiesPanelFromMesh(selectedMesh); studioRenderDirty = true; });
            scene.add(transform);
        }

        resetStudioCameraToGameplay();

        createStudioPart('cube', { name: 'Baseplate', color: '#111a24', material: 'Obsidian', pos: [0, -1, 0], scale: [200, 2, 200] });
        createStudioPart('cube', { name: 'cube_703', color: '#00b7ff', material: 'Plastic', pos: [0, 4, 0], scale: [4, 4, 4], script: 'on start:\n  set this.color = "#00e676"' });
        runAllRGXScripts('start');

        window.addEventListener('resize', onWindowResize);
        renderer.domElement.addEventListener('pointerdown', onViewportPointerDown);
        setStatus('3D Viewport Active • WebGL Ready • RGXScript v2 Ready');
        animateStudio();
    } catch (err) {
        setStatus('3D Init Error: ' + err.message);
    }
}

function resetStudioCameraToGameplay() {
    if (!camera) return;
    camera.position.set(0, 15.8, 38.2);
    if (orbit) { orbit.target.set(0, 2, 0); orbit.update(); }
    else camera.lookAt(0, 2, 0);
    studioRenderDirty = true;
}

function createStudioPart(type, opts = {}) {
    if (!scene || studioObjects.length >= MAX_OBJECTS_PER_WORLD) return null;
    const safeType = ALLOWED_TYPES.has(type) ? type : 'cube';
    const geo = createGeometryForType(safeType);
    const color = normalizeHexColor(opts.color || '#00b7ff');
    const material = ALLOWED_MATERIALS.has(opts.material) ? opts.material : 'Plastic';
    const scale = Array.isArray(opts.scale) && opts.scale.length === 3 ? opts.scale : [4, 4, 4];
    const pos = Array.isArray(opts.pos) && opts.pos.length === 3 ? opts.pos : [0, scale[1] / 2 + 1, 0];
    const rot = Array.isArray(opts.rot) && opts.rot.length === 3 ? opts.rot : [0, 0, 0];
    const mesh = new THREE.Mesh(geo, createMaterialFromPreset(material, color));
    mesh.position.set(Number(pos[0]) || 0, Number(pos[1]) || 0, Number(pos[2]) || 0);
    mesh.scale.set(Math.max(0.05, Number(scale[0]) || 1), Math.max(0.05, Number(scale[1]) || 1), Math.max(0.05, Number(scale[2]) || 1));
    mesh.rotation.set(
        THREE.MathUtils.degToRad(Number(rot[0]) || 0),
        THREE.MathUtils.degToRad(Number(rot[1]) || 0),
        THREE.MathUtils.degToRad(Number(rot[2]) || 0)
    );
    mesh.userData = {
        type: safeType,
        name: String(opts.name || `${safeType}_${Math.floor(Math.random() * 900 + 100)}`),
        color,
        material,
        text: String(opts.text || ''),
        script: String(opts.script || opts.js || '')
    };
    scene.add(mesh);
    studioObjects.push(mesh);
    const countEl = document.getElementById('objCountLabel');
    if (countEl) countEl.innerText = `${studioObjects.length} / ${MAX_OBJECTS_PER_WORLD} Parts`;
    studioRenderDirty = true;
    if (mesh.userData.script) {
        try { executeRGXScriptForEvent(mesh, 'start'); } catch (_) {}
    }
    return mesh;
}

function addSelectedPart() {
    const sel = document.getElementById('addPartType');
    const m = createStudioPart(sel ? sel.value : 'cube');
    if (m) selectObject(m);
}

function duplicateSelectedObject() {
    if (!selectedMesh) return;
    const d = selectedMesh.userData;
    const c = createStudioPart(d.type, {
        name: d.name + '_Copy', color: d.color, material: d.material,
        pos: [selectedMesh.position.x + 2, selectedMesh.position.y, selectedMesh.position.z + 2],
        scale: [selectedMesh.scale.x, selectedMesh.scale.y, selectedMesh.scale.z],
        rot: [THREE.MathUtils.radToDeg(selectedMesh.rotation.x), THREE.MathUtils.radToDeg(selectedMesh.rotation.y), THREE.MathUtils.radToDeg(selectedMesh.rotation.z)],
        text: d.text, script: d.script
    });
    if (c) selectObject(c);
}

function deleteSelectedObject() {
    if (!selectedMesh) return;
    if (transform) transform.detach();
    if (scene) scene.remove(selectedMesh);
    studioObjects = studioObjects.filter(o => o !== selectedMesh);
    selectedMesh = null;
    document.getElementById('prop-content').style.display = 'none';
    document.getElementById('prop-empty').style.display = 'block';
    document.getElementById('objCountLabel').innerText = `${studioObjects.length} / ${MAX_OBJECTS_PER_WORLD} Parts`;
    studioRenderDirty = true;
}

function setTransformMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('tool-active'));
    const btn = document.getElementById('tool-' + mode);
    if (btn) btn.classList.add('tool-active');
    if (transform) {
        if (mode === 'select') transform.detach();
        else { transform.setMode(mode); if (selectedMesh) transform.attach(selectedMesh); }
    }
    studioRenderDirty = true;
}

function selectObject(mesh) {
    selectedMesh = mesh;
    if (!mesh) {
        if (transform) transform.detach();
        document.getElementById('prop-content').style.display = 'none';
        document.getElementById('prop-empty').style.display = 'block';
        return;
    }
    try { executeRGXScriptForEvent(mesh, 'select'); } catch (_) {}
    if (transform && currentMode !== 'select') transform.attach(mesh);
    document.getElementById('prop-empty').style.display = 'none';
    document.getElementById('prop-content').style.display = 'block';
    syncPropertiesPanelFromMesh(mesh);
}

function syncPropertiesPanelFromMesh(mesh) {
    const d = mesh.userData;
    document.getElementById('prop-name').value = d.name;
    document.getElementById('prop-type').value = d.type.toUpperCase();
    document.getElementById('prop-color').value = normalizeHexColor(d.color);
    document.getElementById('prop-material').value = d.material;
    const textRow = document.getElementById('row-text-val');
    const textInput = document.getElementById('prop-text-val');
    if (textRow && textInput) {
        textRow.style.display = d.type === 'sign' ? 'flex' : 'none';
        textInput.value = d.text || '';
    }
    document.getElementById('prop-pos-x').value = mesh.position.x.toFixed(2);
    document.getElementById('prop-pos-y').value = mesh.position.y.toFixed(2);
    document.getElementById('prop-pos-z').value = mesh.position.z.toFixed(2);
    document.getElementById('prop-scale-x').value = mesh.scale.x.toFixed(2);
    document.getElementById('prop-scale-y').value = mesh.scale.y.toFixed(2);
    document.getElementById('prop-scale-z').value = mesh.scale.z.toFixed(2);
    document.getElementById('prop-rot-x').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.x));
    document.getElementById('prop-rot-y').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.y));
    document.getElementById('prop-rot-z').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.z));
    document.getElementById('prop-script').value = d.script || '';
}

function applyPropertyChanges() {
    if (!selectedMesh) return;
    const d = selectedMesh.userData;
    const prevScript = d.script;
    d.name = document.getElementById('prop-name').value || d.name;
    d.color = normalizeHexColor(document.getElementById('prop-color').value);
    d.material = document.getElementById('prop-material').value;
    const textInput = document.getElementById('prop-text-val');
    if (textInput) d.text = textInput.value || '';
    d.script = document.getElementById('prop-script').value;
    if (selectedMesh.material) {
        selectedMesh.material.dispose();
        selectedMesh.material = createMaterialFromPreset(d.material, d.color);
    }
    selectedMesh.position.set(
        parseFloat(document.getElementById('prop-pos-x').value) || 0,
        parseFloat(document.getElementById('prop-pos-y').value) || 0,
        parseFloat(document.getElementById('prop-pos-z').value) || 0
    );
    selectedMesh.scale.set(
        Math.max(0.05, parseFloat(document.getElementById('prop-scale-x').value) || 1),
        Math.max(0.05, parseFloat(document.getElementById('prop-scale-y').value) || 1),
        Math.max(0.05, parseFloat(document.getElementById('prop-scale-z').value) || 1)
    );
    selectedMesh.rotation.set(
        THREE.MathUtils.degToRad(parseFloat(document.getElementById('prop-rot-x').value) || 0),
        THREE.MathUtils.degToRad(parseFloat(document.getElementById('prop-rot-y').value) || 0),
        THREE.MathUtils.degToRad(parseFloat(document.getElementById('prop-rot-z').value) || 0)
    );
    studioRenderDirty = true;
    if (d.script && d.script !== prevScript) {
        try { executeRGXScriptForEvent(selectedMesh, 'start'); } catch (_) {}
    }
}

function onViewportPointerDown(event) {
    if (!renderer || !camera || !raycaster || !mouse) return;
    if (transform && transform.dragging) return;
    const rect = renderer.domElement.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(studioObjects, false);
    selectObject(hits.length ? hits[0].object : null);
}

function generateRGXXml() {
    const title = (document.getElementById('gameTitle') && document.getElementById('gameTitle').value.trim()) || 'Untitled World';
    let xml = `<world title="${escapeHtmlAttr(title)}">\n`;
    studioObjects.forEach(m => {
        const d = m.userData;
        const hex = normalizeHexColor(d.color).replace(/^#/, '');
        const rx = Math.round(THREE.MathUtils.radToDeg(m.rotation.x));
        const ry = Math.round(THREE.MathUtils.radToDeg(m.rotation.y));
        const rz = Math.round(THREE.MathUtils.radToDeg(m.rotation.z));
        xml += `  <part type="${escapeHtmlAttr(d.type)}" name="${escapeHtmlAttr(d.name)}" color="${escapeHtmlAttr(hex)}" material="${escapeHtmlAttr(d.material)}" pos="${m.position.x.toFixed(2)},${m.position.y.toFixed(2)},${m.position.z.toFixed(2)}" scale="${m.scale.x.toFixed(2)},${m.scale.y.toFixed(2)},${m.scale.z.toFixed(2)}" rot="${rx},${ry},${rz}" text="${escapeHtmlAttr(d.text || '')}"/>\n`;
        if (d.script && d.script.trim()) {
            const safeScript = d.script.trim().replace(/<\/script>/gi, '<\\/script>');
            xml += `  <script for="${escapeHtmlAttr(d.name)}">\n${safeScript}\n  \x3c/script\x3e\n`;
        }
    });
    return xml + `</world>`;
}

function exportRGXFile() {
    const blob = new Blob([generateRGXXml()], { type: 'application/xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'world.rgx';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importRGXWorldFile(e) {
    const f = e && e.target && e.target.files ? e.target.files[0] : null;
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        try {
            const doc = new DOMParser().parseFromString(ev.target.result, 'application/xml');
            const root = doc.querySelector('world');
            if (!root) {
                showNotification('Import Warning', 'No <world> root tag found in .rgx file.', 'warning');
                return;
            }
            const worldTitle = root.getAttribute('title');
            if (worldTitle && document.getElementById('gameTitle')) {
                document.getElementById('gameTitle').value = worldTitle;
            }
            clearWorld(false);
            const scripts = new Map();
            root.querySelectorAll('script').forEach(s => {
                const targetName = s.getAttribute('for') || '';
                if (targetName) scripts.set(targetName, (s.textContent || '').trim());
            });
            root.querySelectorAll('part').forEach(p => {
                const name = p.getAttribute('name') || 'Part';
                createStudioPart(p.getAttribute('type') || 'cube', {
                    name,
                    color: p.getAttribute('color') || '00b7ff',
                    material: p.getAttribute('material') || 'Plastic',
                    pos: parseVec3Csv(p.getAttribute('pos'), [0, 0, 0]),
                    scale: parseVec3Csv(p.getAttribute('scale'), [4, 4, 4]),
                    rot: parseVec3Csv(p.getAttribute('rot'), [0, 0, 0]),
                    text: p.getAttribute('text') || '',
                    script: scripts.get(name) || ''
                });
            });
            runAllRGXScripts('start');
            showNotification('Imported .RGX', 'Loaded world into Studio.', 'success');
        } catch (err) {
            showNotification('Import Error', err.message || 'Invalid XML', 'danger');
        } finally {
            try { e.target.value = ''; } catch (_) {}
        }
    };
    r.readAsText(f);
}

function clearWorld(notify = true) {
    if (transform) transform.detach();
    studioObjects.forEach(o => { try { if (scene) scene.remove(o); } catch (_) {} });
    studioObjects = [];
    selectedMesh = null;
    const pc = document.getElementById('prop-content');
    const pe = document.getElementById('prop-empty');
    if (pc) pc.style.display = 'none';
    if (pe) pe.style.display = 'block';
    document.getElementById('objCountLabel').innerText = `0 / ${MAX_OBJECTS_PER_WORLD} Parts`;
    studioRenderDirty = true;
    if (notify) showNotification('Cleared', 'World cleared', 'warning');
}

function clearWorldPrompt() { if (confirm('Clear world?')) clearWorld(true); }

async function testCurrentStudioGame() {
    const player = document.getElementById('game-player');
    const iframe = document.getElementById('game-frame');
    const titleEl = document.getElementById('playerGameTitle');
    if (titleEl && document.getElementById('gameTitle')) {
        titleEl.textContent = document.getElementById('gameTitle').value || 'RayGamix Cloud World';
    }
    player.style.display = 'flex';
    try {
        const res = await fetch(`${CF_BACKEND_URL}/games/test-play`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/xml', 'X-Session-Token': SESSION_TOKEN },
            body: generateRGXXml()
        });
        const txt = await res.text();
        if (!res.ok) throw new Error(txt || 'HTTP ' + res.status);
        if (activeTestBlobUrl) URL.revokeObjectURL(activeTestBlobUrl);
        activeTestBlobUrl = URL.createObjectURL(new Blob([txt], { type: 'text/html' }));
        iframe.src = activeTestBlobUrl;
    } catch (err) {
        const backendBase = typeof CF_BACKEND_URL !== 'undefined' ? String(CF_BACKEND_URL || '') : '';
        const safeErrMsg = String(err && err.message ? err.message : 'Network error reaching RayGamix backend')
            .replace(/[&"\x3c\x3e'\/]/g, c => ({ '&': '&amp;', '\x3c': '&lt;', '\x3e': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#47;' }[c]));
        const safeEndpoint = String(backendBase)
            .replace(/[&"\x3c\x3e'\/]/g, c => ({ '&': '&amp;', '\x3c': '&lt;', '\x3e': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#47;' }[c]));
        const decodeEntities = str => {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = str;
            return textarea.value;
        };
        const encodedErrHtml = `&#60;!DOCTYPE html&#62;&#60;html&#62;&#60;body style=&#34;background:#050816;color:#fff;font-family:sans-serif;padding:40px;text-align:center;&#34;&#62;&#60;h2 style=&#34;color:#ff4444;&#34;&#62;Backend Test Error&#60;/h2&#62;&#60;p style=&#34;color:#cbd5e1;&#34;&#62;${safeErrMsg}&#60;/p&#62;&#60;p style=&#34;color:#7d96b0;font-size:12px;&#34;&#62;Endpoint: ${safeEndpoint}/games/test-play&#60;/p&#62;&#60;/body&#62;&#60;/html&#62;`;
        const errHtml = decodeEntities(encodedErrHtml);

        if (activeTestBlobUrl) URL.revokeObjectURL(activeTestBlobUrl);
        activeTestBlobUrl = URL.createObjectURL(new Blob([errHtml], { type: 'text/html' }));
        iframe.src = activeTestBlobUrl;
    }
}

async function confirmPublishGame() {
    try {
        const res = await fetch(`${CF_BACKEND_URL}/games/publish`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/xml', 'X-Session-Token': SESSION_TOKEN },
            body: generateRGXXml()
        });
        const txt = await res.text();
        showNotification(res.ok ? 'Published' : 'Publish Failed', txt.slice(0, 140), res.ok ? 'success' : 'danger');
    } catch (err) {
        showNotification('Backend Unreachable', err.message, 'danger');
    }
}

function closeGamePlayer() {
    document.getElementById('game-player').style.display = 'none';
    const iframe = document.getElementById('game-frame');
    if (iframe) iframe.src = 'about:blank';
    if (activeTestBlobUrl) {
        URL.revokeObjectURL(activeTestBlobUrl);
        activeTestBlobUrl = null;
    }
}

function onWindowResize() {
    const c = document.getElementById('studio-viewport');
    if (camera && renderer && c && c.clientWidth > 0 && c.clientHeight > 0) {
        camera.aspect = c.clientWidth / c.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(c.clientWidth, c.clientHeight);
        studioRenderDirty = true;
    }
}

function animateStudio() {
    requestAnimationFrame(animateStudio);
    try {
        if (!renderer || !scene || !camera) return;
        rgxScriptTickCounter++;
        if (rgxScriptTickCounter % 30 === 0) {
            runAllRGXScripts('tick');
        }
        if (orbit && orbit.update()) studioRenderDirty = true;
        if (studioRenderDirty) {
            renderer.render(scene, camera);
            studioRenderDirty = false;
        }
    } catch (err) {
        setStatus('Render Guard: ' + (err && err.message ? err.message : err));
    }
}

window.addEventListener('DOMContentLoaded', initStudioWhenReady);
setTimeout(initStudioWhenReady, 300);
</script>
