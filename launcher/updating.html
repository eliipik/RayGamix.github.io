<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Our avatars are waiting!</title>
        
        <style>
            * {
                box-sizing: border-box;
            }
            
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                font-family: Arial, sans-serif;
                background-color: #212121;
                color: white;
                margin-top: 70px;
                zoom: 1.2;
                }
                
                h1 {
                    font-size: clamp(1.5rem, 4vw, 1.75rem);
                    font-weight: 700;
                    }
                    
                    h3 {
                    font-weight: 100;
                    }
                     </style>
                     </head>
                      
                      <body>
                           <h1 style="zoom:2">Please wait a moment!</h1><br><p style="zoom: 1.5;">RayGamix is getting updated. Version 1.2 will release in under 8 hours.</p><br>
                           <h5 style="zoom:1.2;">Thank you for understanding!</h5>
                               <style>
        @font-face {
            font-family: 'RayGamix Neue';
            src: url('https://raygamix.com/RayGamix%20Neue/RayGamix_Neue_regular.ttf') format('truetype');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'RayGamix Neue';
        }
        #avatar-demo-container {
            width: 50vmin;
            height: 50vmin;
            max-width: 300px;
            max-height: 300px;
            position: relative;
        }
        #avatar-demo-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
    <div id="avatar-demo-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function () {
            const DEFAULT_AVATAR = {
                headColor: 0xffdbac,
                torsoColor: 0x00b7ff,
                legsColor: 0x0000ff,
                facePng: 'https://raygamix.github.io/hardcodedassets/happy.png'
            };
            const AVATAR_STYLE = 'blocky';

            const container = document.getElementById('avatar-demo-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            // Move camera back and aim at the middle of the avatar (y ≈ 2.7)
            camera.position.set(0, 2.7, 12);
            camera.lookAt(0, 2.7, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
            keyLight.position.set(5, 10, 5);
            keyLight.castShadow = true;
            scene.add(keyLight);
            const rimLight = new THREE.DirectionalLight(0x00b7ff, 0.5);
            rimLight.position.set(-5, 5, -5);
            scene.add(rimLight);

            function createRoundedBoxGeometry(w, h, d, radius = 0.12, segments = 4) {
                const geo = new THREE.BoxGeometry(w, h, d, segments, segments, segments);
                const pos = geo.attributes.position;
                const halfW = w / 2 - radius, halfH = h / 2 - radius, halfD = d / 2 - radius;
                const v = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++) {
                    v.fromBufferAttribute(pos, i);
                    const x = Math.max(-halfW, Math.min(halfW, v.x));
                    const y = Math.max(-halfH, Math.min(halfH, v.y));
                    const z = Math.max(-halfD, Math.min(halfD, v.z));
                    v.sub(new THREE.Vector3(x, y, z)).normalize().multiplyScalar(radius).add(new THREE.Vector3(x, y, z));
                    pos.setXYZ(i, v.x, v.y, v.z);
                }
                geo.computeVertexNormals();
                return geo;
            }
            const makeMat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.1 });

            function buildAvatarRig(config) {
                const root = new THREE.Group();
                const skin = config.headColor, torsoCol = config.torsoColor, legsCol = config.legsColor;

                let torsoWidth, limbWidth, legWidth, headGeo;
                if (AVATAR_STYLE === 'blocky') {
                    torsoWidth = 1.85; limbWidth = 0.75; legWidth = 0.85;
                    headGeo = createRoundedBoxGeometry(1.25, 1.25, 1.25, 0.1, 3);
                } else if (AVATAR_STYLE === 'blockyNonRounded') {
                    torsoWidth = 1.85; limbWidth = 0.75; legWidth = 0.85;
                    headGeo = new THREE.BoxGeometry(1.25, 1.25, 1.25);
                } else if (AVATAR_STYLE === 'round') {
                    torsoWidth = 1.6; limbWidth = 0.6; legWidth = 0.7;
                    headGeo = new THREE.SphereGeometry(0.65, 16, 16);
                } else {
                    torsoWidth = 1.7; limbWidth = 0.7; legWidth = 0.8;
                    headGeo = createRoundedBoxGeometry(1.25, 1.25, 1.25, 0.1, 3);
                }

                const head = new THREE.Mesh(headGeo, makeMat(skin));
                head.position.y = 4.8; head.castShadow = true;
                if (config.facePng) {
                    const tex = new THREE.TextureLoader().load(config.facePng);
                    tex.transparent = true;
                    const face = new THREE.Mesh(
                        new THREE.PlaneGeometry(1, 1),
                        new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05 })
                    );
                    face.position.set(0, 0, 0.63);
                    head.add(face);
                }

                let torsoGeo;
                if (AVATAR_STYLE === 'round') torsoGeo = new THREE.SphereGeometry(1.0, 16, 16);
                else if (AVATAR_STYLE === 'blockyNonRounded') torsoGeo = new THREE.BoxGeometry(torsoWidth, 2.2, 0.95);
                else torsoGeo = createRoundedBoxGeometry(torsoWidth, 2.2, 0.95, 0.1, 3);
                const torso = new THREE.Mesh(torsoGeo, makeMat(torsoCol));
                torso.position.y = 3.1; torso.castShadow = true;

                function makeLimb(color, x, y, isLeg) {
                    let geo;
                    const w = isLeg ? legWidth : limbWidth;
                    const h = 2.0;
                    const d = isLeg ? legWidth : limbWidth;
                    if (AVATAR_STYLE === 'round') geo = new THREE.SphereGeometry(w / 2, 12, 12);
                    else if (AVATAR_STYLE === 'blockyNonRounded') geo = new THREE.BoxGeometry(w, h, d);
                    else geo = createRoundedBoxGeometry(w, h, d, 0.08, 3);
                    const pivot = new THREE.Group();
                    pivot.position.set(x, y, 0);
                    const mesh = new THREE.Mesh(geo, makeMat(color));
                    mesh.position.set(0, -h / 2, 0); mesh.castShadow = true;
                    pivot.add(mesh);
                    return pivot;
                }

                const lArm = makeLimb(skin, -1.3, 4.1, false);
                const rArm = makeLimb(skin, 1.3, 4.1, false);
                const lLeg = makeLimb(legsCol, -0.45, 2.0, true);
                const rLeg = makeLimb(legsCol, 0.45, 2.0, true);

                root.add(head, torso, lArm, rArm, lLeg, rLeg);
                return { group: root, head, torso, leftArm: lArm, rightArm: rArm, leftLeg: lLeg, rightLeg: rLeg };
            }

            // Avatar stays at origin – camera is aimed at its center
            const rig = buildAvatarRig(DEFAULT_AVATAR);
            scene.add(rig.group);

            const waveStart = performance.now();
            function animate() {
                requestAnimationFrame(animate);
                const t = performance.now();
                const elapsed = t - waveStart;

                // Wave the right arm
                rig.rightArm.rotation.x = -2.8;
                rig.rightArm.rotation.z = 0.5 + Math.sin(elapsed * 0.012) * 0.6;

                // Gentle idle sway
                rig.torso.rotation.y = Math.sin(t * 0.001) * 0.05;
                rig.leftArm.rotation.x = Math.sin(t * 0.0015) * 0.1;

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        })();
    </script>

                           </body>
                           </html>
