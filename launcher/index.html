<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RayGamix Launcher & Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" href="https://raygamix.com/favicon.png">
    <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    <link rel="dns-prefetch" href="https://raygamix-backend.raybod8765.workers.dev">
    <link rel="preconnect" href="https://raygamix-backend.raybod8765.workers.dev" crossorigin>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <style>
        @font-face { font-family: 'RayGamix Neue'; src: url('https://raygamix.com/RayGamix%20Neue/RayGamix_Neue_regular.ttf') format('truetype'); font-weight: normal; font-style: normal; }
        :root { --bg:#03070b; --panel:#0a131c; --card:#111a24; --muted:#7d96b0; --accent:#00b7ff; --glass:rgba(255,255,255,0.05); --gold:#ffc107; --red:#ff4444; --green:#00e676; --card-border:#162438; --accent-glow:rgba(0,183,255,0.4); --text:#ffffff; --subtext:#cbd5e1; }
        body.light-theme { --bg:#f0f4f8; --panel:#ffffff; --card:#e2e8f0; --muted:#64748b; --accent:#0088cc; --glass:rgba(0,0,0,0.04); --gold:#d97706; --red:#dc2626; --green:#16a34a; --card-border:#cbd5e1; --accent-glow:rgba(0,136,204,0.3); --text:#0f172a; --subtext:#334155; }
        * { box-sizing: border-box; font-family: 'RayGamix Neue', system-ui, -apple-system, sans-serif !important; }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; touch-action: manipulation; transition: background 0.3s, color 0.3s; }
        body.forced-phone-ui { zoom: 0.85 !important; }
        body.forced-desktop-ui { zoom: 1 !important; }
        .app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 80px 1fr; gap: 16px; height: 100vh; width: 100vw; padding: 20px; box-sizing: border-box; }
        .sidebar { grid-row: 1 / span 2; background: linear-gradient(180deg, var(--panel), transparent); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; border-right: 1px solid var(--card-border); overflow-y: auto; }
        .avatar-viewport { width: 100%; height: 260px; max-height: 35vh; background: var(--panel); border-radius: 12px; border: 1px solid var(--accent); overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--accent-glow); position: relative; box-sizing: border-box; }
        .avatar-viewport canvas { width: 100% !important; height: 100% !important; display: block; border-radius: inherit; background-color: transparent !important; }
        .topbar { grid-column: 2; display: flex; align-items: center; gap: 12px; }
        .logo { height: 42px; font-weight: 900; color: var(--accent); letter-spacing: -1px; margin-right: 5px; text-shadow: 0 0 10px var(--accent-glow); display: flex; align-items: center; gap: 6px; }
        .logo img { height: 100%; object-fit: contain; }
        .search { flex: 1; display: flex; align-items: center; background: var(--glass); padding: 14px 18px; border-radius: 10px; border: 1px solid var(--card-border); }
        .search input { background: transparent; border: 0; outline: none; color: var(--text); width: 100%; font-size: 15px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 800; width: 100%; transition: 0.15s; text-align: center; box-sizing: border-box; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; user-select: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-glow); }
        .btn-alt { background: var(--glass); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 13px; font-weight: bold; transition: 0.2s; user-select: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-alt:hover { background: var(--card); border-color: var(--accent); }
        .badge-rank { background: linear-gradient(135deg, #cc66ff, var(--accent)); color: #000; font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .token-counter { display: flex; align-items: center; gap: 6px; background: rgba(255,193,7,0.15); border: 1px solid var(--gold); color: var(--gold); font-weight: 900; padding: 6px 12px; border-radius: 20px; font-size: 13px; }
        .btn-tool { background: var(--card); color: var(--text); border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-tool:hover { background: var(--accent); color: #000; }
        .tool-active { background: var(--accent) !important; color: #000 !important; }
        .main { grid-column: 2; background: rgba(0,0,0,0.1); border-radius: 12px; padding: 25px; overflow-y: auto; border: 1px solid var(--card-border); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 18px; border: 1px solid var(--card-border); position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; cursor: pointer; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card-type-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,183,255,0.2); border: 1px solid var(--accent); color: var(--accent); font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .card-actions { display: flex; gap: 8px; margin-top: 15px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .panel { background: var(--panel); padding: 35px; border-radius: 20px; border: 1px solid var(--accent); width: 540px; max-width: 92vw; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 0 50px var(--accent-glow); box-sizing: border-box; }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; color: var(--red); font-weight: bold; transition: 0.2s; }
        .close-btn:hover { transform: scale(1.2); }
        #notification-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-notification { pointer-events: auto; background: var(--panel); border: 1px solid var(--accent); color: var(--text); padding: 14px 18px; border-radius: 10px; font-weight: bold; box-shadow: 0 5px 20px var(--accent-glow); width: 320px; max-width: 90vw; animation: toastIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); display: flex; align-items: center; gap: 12px; font-size: 13px; line-height: 1.4; }
        .toast-notification.toast-success { border-color: var(--green); box-shadow: 0 5px 20px rgba(0,230,118,0.3); }
        .toast-notification.toast-warning { border-color: var(--gold); box-shadow: 0 5px 20px rgba(255,193,7,0.3); }
        .toast-notification.toast-danger { border-color: var(--red); box-shadow: 0 5px 20px rgba(255,68,68,0.3); }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .game-detail-header-bar { background: #000; border-bottom: 2px solid var(--card-border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; gap: 15px; border-radius: 12px 12px 0 0; }
        .game-detail-img-box { width: 120px; height: 75px; background: #111a24; border: 2px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: var(--accent); overflow: hidden; flex-shrink: 0; }
        .game-detail-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .game-detail-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .game-detail-body { background: #070d14; padding: 25px; border-radius: 0 0 12px 12px; color: var(--subtext); }
        .studio-layout { display: flex; flex-direction: column; width: 100vw; height: 100vh; background: #020406; overflow: hidden; }
        .studio-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; background: #071018; border-bottom: 1px solid #142536; gap: 10px; flex-wrap: wrap; }
        .studio-toolbar { background: #0a1520; padding: 12px 25px; display: flex; gap: 8px; border-bottom: 1px solid #142536; align-items: center; flex-wrap: wrap; }
        .studio-body { display: flex; flex: 1; min-height: 0; }
        .studio-viewport { flex: 1; background: #000; position: relative; overflow: hidden; cursor: crosshair; min-height: 200px; }
        .studio-sidebar { width: 340px; background: #071018; border-left: 1px solid #142536; display: flex; flex-direction: column; }
        .prop-section { padding: 15px; border-bottom: 1px solid #142536; overflow-y: auto; flex: 1; }
        .prop-row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; font-size: 12px; color: var(--muted); font-weight: bold; }
        .prop-input { flex: 1; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 8px 10px; font-size: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; transition: 0.2s; }
        .prop-input:focus { border-color: var(--accent); outline: none; }
        .prop-vec3 { display: flex; gap: 6px; flex: 1; }
        .prop-vec3 input { width: 33%; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 6px; font-size: 12px; text-align: center; border-radius: 4px; }
        #game-player { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; padding: 0; margin: 0; flex-direction: column; }
        .player-header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10001; pointer-events: none; }
        .player-header * { pointer-events: auto; }
        #game-frame { width: 100%; height: 100%; border: none; background: #000; position: absolute; inset: 0; z-index: 10000; }
        #game-loader { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #0a131c 0%, #000 100%); z-index: 10002; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; pointer-events: none; }
        #game-loader .spinner { width: 70px; height: 70px; border-radius: 50%; border: 4px solid rgba(0,183,255,0.15); border-top-color: #00b7ff; animation: rgxspin 0.9s linear infinite; box-shadow: 0 0 30px rgba(0,183,255,0.4); }
        #game-loader .loader-text { color: #00b7ff; font-weight: 900; font-size: 18px; letter-spacing: 1px; text-shadow: 0 0 12px rgba(0,183,255,0.6); }
        #game-loader .loader-sub { color: #7d96b0; font-size: 12px; font-weight: bold; margin-top: 6px; }
        @keyframes rgxspin { to { transform: rotate(360deg); } }
        @media (max-width: 850px) {
            html, body { overflow-y: auto; zoom: 0.85; }
            .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; min-height: 100vh; padding: 12px; gap: 12px; }
            .sidebar { grid-row: auto; width: 100%; box-sizing: border-box; border-right: none; border-bottom: 1px solid var(--card-border); }
            .topbar { grid-column: 1; flex-wrap: wrap; }
            .main { grid-column: 1; padding: 15px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .studio-body { flex-direction: column; }
            .studio-sidebar { width: 100%; max-height: 35vh; border-left: none; border-top: 1px solid #142536; }
        }
    </style>
</head>
<body>

<div id="notification-toast-container"></div>

<div class="app">
    <aside class="sidebar">
        <div class="avatar-viewport" id="avatarCanvas"></div>
        <div style="font-weight:900; color:var(--accent); font-size:18px; display: flex; align-items: center; margin-top:4px; text-transform: uppercase;"><span id="uDisp">Guest</span></div>
        <div id="uRankBadge" class="badge-rank">GUEST</div>
        <div class="token-counter" style="margin-top: 4px;"><span>🪙 Tokens:</span> <span id="uTokenDisp">100</span></div>
        <button class="btn" style="background:linear-gradient(135deg, var(--gold), #ff8800); color:#000; margin-top:6px;" onclick="openTokenRewardsModal()">🎁 Tokens & Rewards</button>
        <button class="btn-alt" onclick="openShop()">🛒 Avatar Customizer</button>
        <button class="btn-alt" style="border-color:#cc66ff; color:#cc66ff;" onclick="openFriendsModal()">👥 Friends & DM Chat</button>
        <button class="btn" style="margin-top: 4px;" onclick="openStudio()">🛠️ Launch Studio</button>
    </aside>

    <header class="topbar">
        <div class="logo">
            <img src="https://raygamix.com/logo.png" alt="RayGamix" onerror="this.onerror=null; this.src='https://placehold.co/180x45/0a131c/00b7ff?text=⚡+RAYGAMIX';">
        </div>
        <div class="search">
            <input id="gSearch" placeholder="Search RGX Games or Authors..." oninput="renderAppContent()">
        </div>
        <button class="btn-alt" style="width: auto; padding: 12px 18px;" onclick="openDirectChatModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Direct Chat
        </button>
        <button class="btn-alt" style="width: auto; padding: 12px 18px;" onclick="openSettingsModal()">⚙️ Settings</button>
        <button class="btn-alt" style="width: auto; padding: 12px 18px;" onclick="openAuth()" id="btnAccountText">👤 Account</button>
        <button class="btn-alt" id="btnLogoutBtn" style="width: auto; padding: 12px 18px; border-color:var(--red); color:var(--red); display:none;" onclick="handleLogout()">🚪 Log Out</button>
    </header>

    <main class="main">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="margin:0; color:var(--text); font-size: 20px;" id="hubHeadingText">RayGamix Games Hub</h2>
            <span style="font-size: 12px; color: var(--accent); font-weight: bold;">v12.5 RGX XML Engine</span>
        </div>
        <div class="grid" id="gameGrid"></div>
    </main>
</div>

<!-- Game Detail Modal -->
<div class="overlay" id="game-detail-panel">
    <div class="panel" style="padding:0; width: 640px; max-width: 95vw; background:#070d14; border-color:var(--accent);">
        <div class="close-btn" style="top:12px; right:15px; z-index:10;" onclick="document.getElementById('game-detail-panel').style.display='none'">×</div>
        <div class="game-detail-header-bar">
            <div class="game-detail-img-box" id="detailImgBox">[img]</div>
            <div class="game-detail-actions">
                <button class="btn" style="width:auto; padding:10px 22px; font-size:14px;" id="detailPlayBtn">[Play]</button>
                <button class="btn-alt" style="width:auto; padding:10px 14px;" onclick="toggleFavoriteCurrentGame()" id="detailFavBtn">⭐️ Favorite</button>
                <button class="btn-alt" style="width:auto; padding:10px 14px; border-color:var(--gold); color:var(--gold);" onclick="openReportModal()">🚩 Report</button>
                <button class="btn-alt" style="width:auto; padding:10px 14px; border-color:var(--green); color:var(--green);" onclick="likeCurrentGame()" id="detailLikeBtn">👍 Like (<span id="detailLikeCount">0</span>)</button>
            </div>
        </div>
        <div class="game-detail-body">
            <h2 style="margin:0 0 8px 0; color:var(--text); font-size:24px; font-weight:900;" id="detailGameTitle">Game Name</h2>
            <div style="font-size:13px; color:var(--accent); font-weight:bold; margin-bottom:15px;" id="detailGameCreator">Made by Builder</div>
            <p style="font-size:14px; line-height:1.6; color:var(--subtext); margin-bottom:20px;" id="detailGameDesc">Description</p>
            <div style="display:flex; gap:15px; font-size:12px; color:var(--muted); border-top:1px solid var(--card-border); padding-top:15px;">
                <span>👁️ Visits: <strong id="detailVisits" style="color:var(--text);">0</strong></span>
                <span>📅 Format: <strong style="color:var(--gold);">.RGX XML Markup</strong></span>
                <span>⭐ Rating: <strong style="color:var(--gold);">4.9 / 5.0</strong></span>
            </div>
        </div>
    </div>
</div>

<!-- Settings Panel -->
<div class="overlay" id="settings-panel">
    <div class="panel" style="max-width: 520px;">
        <div class="close-btn" onclick="document.getElementById('settings-panel').style.display='none'">×</div>
        <h2 style="color:var(--accent); margin-top:0; font-size: 24px; font-weight:800;">⚙️ RayGamix Settings</h2>
        <p style="color:var(--muted); font-size:13px; margin-bottom: 20px;">Manage theme, layout, avatar style, and guest credentials:</p>
        <div style="margin-bottom: 18px;">
            <label style="color:var(--text); font-weight:bold; font-size:13px; display:block; margin-bottom:6px;">🎨 Color Theme Mode:</label>
            <div style="display:flex; gap:10px;">
                <button id="btnThemeDark" class="btn-alt" style="flex:1; padding:10px;" onclick="setAppTheme('dark')">🌙 Dark Mode</button>
                <button id="btnThemeLight" class="btn-alt" style="flex:1; padding:10px;" onclick="setAppTheme('light')">☀️ Light Mode</button>
            </div>
        </div>
        <div style="margin-bottom: 18px;">
            <label style="color:var(--text); font-weight:bold; font-size:13px; display:block; margin-bottom:6px;">📱 Interface Layout:</label>
            <div style="display:flex; gap:10px;">
                <button id="btnUiPhone" class="btn-alt" style="flex:1; padding:10px;" onclick="selectUiSetting('phone')">📱 Phone UI</button>
                <button id="btnUiDesktop" class="btn-alt" style="flex:1; padding:10px;" onclick="selectUiSetting('desktop')">💻 Desktop UI</button>
            </div>
        </div>
        <div style="margin-bottom: 20px;">
            <label style="color:var(--text); font-weight:bold; font-size:13px; display:block; margin-bottom:6px;">🧑‍🎨 Avatar Style:</label>
            <select id="avatar-style-select" class="prop-input" style="padding:8px;">
                <option value="blocky">Blocky (Rounded)</option>
                <option value="blockyNonRounded">Blocky (Non‑Rounded)</option>
                <option value="round">Round (Circles)</option>
                <option value="realistic">Realistic (Hands + Feet)</option>
                <option value="gameRealistic">Game Realistic (Jelly R15)</option>
            </select>
        </
